[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgdbench"
version = "0.1.0"
description = "GRAT: Grounding as Transport, language-driven grasp detection on Grasp-Anything++"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: needs CUDA (skipped on the local machine)"]
